name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # README/CHANGELOG/CONTRIBUTING/SECURITY (all three languages) are
  # generated by @ktav-lang/polydoc from the root-docs/ unit trees. This
  # job fails when a committed artifact drifts from its source — which is
  # what a hand-edit of the artifact looks like. Fix the source and
  # re-run the generator; never patch the artifact.
  # ------------------------------------------------------------------
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated docs are byte-identical to their source units
        run: node scripts/build-docs.mjs --check

  # ------------------------------------------------------------------
  # Build native library + run Java tests in one job per OS. The test
  # suite hardcodes both paths (cabi at `target/release/...`, spec at
  # `spec/versions/0.8/tests`) — no env wiring needed.
  # ------------------------------------------------------------------
  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.jdk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: ["17", "21"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        run: cargo build --release -p ktav-cabi

      - name: Gradle test
        run: ./gradlew :lib:test --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: lib/build/reports/tests/test
          retention-days: 7

  lint-rust:
    name: rust clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release -p ktav-cabi -- -D warnings

  build-jar:
    name: build library JAR (no native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # vanniktech maven-publish renames javadocJar → mavenPlainJavadocJar.
      - run: ./gradlew :lib:jar :lib:sourcesJar :lib:mavenPlainJavadocJar --no-daemon
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: ktav-jars
          path: |
            lib/build/libs/*.jar
          retention-days: 14

  # ------------------------------------------------------------------
  # Pure-Java backend: full corpus + API/negative/regression tests run
  # with NO cargo build step at all — proving lang.ktav.pure never
  # loads or downloads the native library. Gradle fails when a --tests
  # filter matches nothing, so a missing pure suite is RED here, not
  # skipped. CrossBackendTest deliberately stays out: it needs the
  # built cabi and runs in the `test` job.
  # ------------------------------------------------------------------
  test-pure:
    name: pure backend (no native build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pure-backend tests (no cargo)
        run: >
          ./gradlew :lib:test --no-daemon --stacktrace
          --tests "lang.ktav.PureConformanceTest"
          --tests "lang.ktav.PureApiTest"
          --tests "lang.ktav.PureNegativeTest"
          --tests "lang.ktav.PureRegressionTest"
          --tests "lang.ktav.PureNoNativeTest"
          --tests "lang.ktav.CorpusGuardMutationTest"
          --tests "lang.ktav.PureWhitespaceTest"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-pure
          path: lib/build/reports/tests/test
          retention-days: 7

  # ------------------------------------------------------------------
  # Packaged pure backend: run the JUnit-free smoke main against the
  # PACKAGED jar, twice —
  #   1. via the :lib:pureJarTest JavaExec (classpath = jar +
  #      jackson-core ONLY: no JNA, no JUnit — so a green run proves
  #      lang.ktav.pure never touches the native resolver), and
  #   2. via a DIRECT java command over build/libs + build/pure-lib,
  #      proving the same classpath sufficiency OUTSIDE Gradle.
  # The task plants a nonexistent KTAV_LIB_PATH; any accidental native
  # resolution would fail loudly against it.
  # ------------------------------------------------------------------
  packaged-pure:
    name: packaged jar pure smoke (no native on classpath)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar + run pureJarTest (Gradle, jar + jackson-core only)
        # pureCheckDeps packages the compiled smoke checker as a jar
        # (pureCheckJar) and copies it into build/pure-check/ for the
        # direct java run below. The checker MUST be a jar: a java -cp
        # wildcard expands jar files only, never a loose .class tree.
        run: >
          ./gradlew :lib:jar :lib:pureJarTest :lib:pureDeps :lib:pureCheckJar :lib:pureCheckDeps
          --no-daemon --stacktrace

      - name: Direct java run (no Gradle, same minimal classpath)
        env:
          KTAV_LIB_PATH: /nonexistent/ktav-native-guard
        run: |
          java -cp "lib/build/libs/*:lib/build/pure-check/*:lib/build/pure-lib/*" lang.ktav.PureSmokeMain
