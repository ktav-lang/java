name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-acceptance:
    name: Verify accepted tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the package version and successful full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = v0.8.1 || { echo 'tag does not match package version' >&2; exit 1; }
          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          test "$target" = "$GITHUB_SHA" || { echo 'tag does not match the built commit' >&2; exit 1; }
          accepted="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --limit 20 --json databaseId --jq 'length')"
          test "$accepted" -gt 0 || { echo 'no successful full CI for this commit' >&2; exit 1; }

  # ------------------------------------------------------------------
  # Cross-compile the cdylib for six platforms. Each job uploads a
  # single asset named the way `NativeLoader.assetName()` expects.
  # ------------------------------------------------------------------
  build-native:
    name: native / ${{ matrix.settings.asset }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: libktav_cabi-linux-amd64.so
            artifact: libktav_cabi.so
            use-zigbuild: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: libktav_cabi-linux-arm64.so
            artifact: libktav_cabi.so
            use-zigbuild: true

          - os: macos-latest
            target: x86_64-apple-darwin
            asset: libktav_cabi-darwin-amd64.dylib
            artifact: libktav_cabi.dylib
            use-zigbuild: false

          - os: macos-latest
            target: aarch64-apple-darwin
            asset: libktav_cabi-darwin-arm64.dylib
            artifact: libktav_cabi.dylib
            use-zigbuild: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ktav_cabi-windows-amd64.dll
            artifact: ktav_cabi.dll
            use-zigbuild: false

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: ktav_cabi-windows-arm64.dll
            artifact: ktav_cabi.dll
            use-zigbuild: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - name: Install zig
        if: matrix.settings.use-zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install cargo-zigbuild
        if: matrix.settings.use-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Verify published Rust core provenance
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo update -p ktav --precise 0.8.1
          python3 - <<'PY'
          import tomllib
          with open('Cargo.lock', 'rb') as source:
              packages = tomllib.load(source)['package']
          core = [package for package in packages if package['name'] == 'ktav']
          if len(core) != 1:
              raise SystemExit('expected exactly one ktav core')
          expected = {
              'version': '0.8.1',
              'source': 'registry+https://github.com/rust-lang/crates.io-index',
              'checksum': '7140dfe2fa6c320e74768cd6a637828c2d26f81746254f4fcd805f3993bd3fd5',
          }
          for field, value in expected.items():
              if core[0].get(field) != value:
                  raise SystemExit(f'ktav {field} mismatch: {core[0].get(field)!r}')
          print('published ktav 0.8.1 core provenance verified')
          PY

      - name: Build (zigbuild)
        if: matrix.settings.use-zigbuild
        run: cargo zigbuild --locked --release -p ktav-cabi --target ${{ matrix.settings.target }}.2.17

      - name: Build (native)
        if: ${{ !matrix.settings.use-zigbuild }}
        run: cargo build --locked --release -p ktav-cabi --target ${{ matrix.settings.target }}

      - name: Rename artifact
        shell: bash
        run: |
          src="target/${{ matrix.settings.target }}/release/${{ matrix.settings.artifact }}"
          ls -la "$src"
          cp "$src" "${{ matrix.settings.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.settings.asset }}
          path: ${{ matrix.settings.asset }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Build the Java JARs (main / sources / javadoc). publish-maven sends
  # them to Maven Central; these copies are also attached to the GitHub
  # Release as a direct-download fallback.
  # ------------------------------------------------------------------
  build-jars:
    name: build JARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle build
        # vanniktech maven-publish renames javadocJar to
        # mavenPlainJavadocJar, so we either ask for that explicitly or
        # let the publication-graph trigger the right task transitively.
        run: >
          ./gradlew :lib:jar :lib:sourcesJar :lib:mavenPlainJavadocJar
          :lib:generatePomFileForMavenPublication
          :lib:generateMetadataFileForMavenPublication :lib:pureJarTest --no-daemon

      - name: Verify publication metadata and exact JAR payload
        run: |
          set -euo pipefail
          bash scripts/check-publish-metadata.sh
          for jar in ktav-0.8.1.jar ktav-0.8.1-sources.jar lib-maven-javadoc-0.8.1-javadoc.jar; do
            test -s "lib/build/libs/$jar" || { echo "missing JAR: $jar" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            lib/build/libs/ktav-0.8.1.jar
            lib/build/libs/ktav-0.8.1-sources.jar
            lib/build/libs/lib-maven-javadoc-0.8.1-javadoc.jar
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish the JARs to Maven Central via Sonatype Central Portal.
  # The vanniktech plugin handles signing, staging upload, and (with
  # automaticRelease=true on the build side) promotion to the public
  # repository. Credentials and the GPG key come from repo secrets.
  # ------------------------------------------------------------------
  publish-maven:
    name: publish to Maven Central
    needs: [build-native, build-jars, verify-acceptance]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        env:
          # vanniktech plugin reads these as Gradle project properties
          # (the ORG_GRADLE_PROJECT_ prefix is the standard pass-through).
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          # Armored ASCII private key (the literal `-----BEGIN PGP
          # PRIVATE KEY BLOCK-----` block). Passphrase is empty (key was
          # generated with %no-protection), so no GPG_PASSPHRASE secret.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./gradlew :lib:pureJarTest :lib:generatePomFileForMavenPublication \
            :lib:generateMetadataFileForMavenPublication --no-configuration-cache --no-daemon
          bash scripts/check-publish-metadata.sh
          ./gradlew :lib:publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon

  # ------------------------------------------------------------------
  # Attach artifacts to the GitHub Release matching the tag.
  # ------------------------------------------------------------------
  release:
    needs: [build-native, build-jars, publish-maven, verify-acceptance]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
